name: Build and Push Docker Images

# Trigger on tag pushes (releases) or manually via workflow_dispatch
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend/backend_app
            image: agentks-backend

          - name: rag-mcp-service
            context: ./backend/rag_mcp_service
            image: agentks-rag-mcp

          - name: basic-tools-mcp-service
            context: ./backend/basic_tools_mcp_service
            image: agentks-basic-tools-mcp

          - name: hyperparam-advisor-mcp-service
            context: ./backend/hyperparam_advisor_mcp_service
            image: agentks-hyperparam-advisor-mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ github.event_name == 'push' || inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
