; supervisord configuration to run two uvicorn instances
[supervisord]
nodaemon=true

[program:admin]
command=uvicorn admin.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
startretries=3

[program:agents]
command=uvicorn agents.main:app --host 0.0.0.0 --port 4000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
startretries=3

[program:url_watcher]
command=python -u -m urls.daemons.url_watcher
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
startretries=3

[program:tools_watcher]
command=python -u -m tools.daemons.watcher
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
startretries=3

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock
